[tox]
requires =
    tox>=4
; env_list = lint, type, 3.1{3,2}
env_list = lint, 3.1{3,2}
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = run unit tests
deps =
    pytest>=8
    pytest-sugar
    pytest-cov
    pytest-mock
    pytest-xvfb
    -r requirements.txt
commands =
    {envpython} -m pytest {posargs}

[testenv:lint]
description = run linters
skip_install = true
deps = ruff==0.16.5
commands =
    ruff check .
    ruff format --check .

; [testenv:type]
; description = run type checks
; deps =
;     mypy
; commands =
;     mypy {posargs:src tests}

[testenv:signed_sdist]
description = create and sign the source tarball
skip_install = true
allowlist_externals =
    bash
    gpg
    rm
deps =
    build
commands =
    rm -f dist/*
    pyproject-build -s
    bash -c "gpg --detach-sign --armor dist/*.tar.gz"
