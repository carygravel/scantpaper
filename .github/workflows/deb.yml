name: Build packages
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git revision to package (default: github.sha)"
        required: false
        type: string

permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    # The packaging needs debhelper-compat 14, and Debian unstable provides
    # every dependency without a PPA.
    container: debian:sid-slim
    steps:
      # debian:sid-slim has no git or CA certificates, and actions run inside
      # the container, so install them before checking out.
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            python3 \
            build-essential \
            debhelper \
            devscripts \
            fakeroot \
            equivs

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The renderer derives the version from the commit count, so it
          # needs the full history and the tags.
          fetch-depth: 0

      # The job container runs as a different user from the workspace owner,
      # so git refuses to read the checkout unless it is marked safe.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Every packaging file comes from packaging/debian and is rendered into
      # a throwaway tree under build/deb. Nothing is authored in this
      # workflow, and no debian/ directory is created in the checkout.
      - name: Render the Debian source tree
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
        run: |
          version=$(python3 dev/prepare_deb.py --source-ref "$SOURCE_REF")
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          # mk-build-deps's default tool is apt-get without -y, which aborts
          # on the confirmation prompt in a non-interactive job.
          mk-build-deps --install --remove \
            -t "apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends -y" \
            "build/deb/scantpaper-${VERSION}/debian/control"

      - name: Build DEB Package
        run: |
          cd "build/deb/scantpaper-${VERSION}"
          # Lintian runs in the checks job, so do not run it here.
          debuild --no-lintian -us -uc -b
          dpkg-deb --contents "../scantpaper_${VERSION}_all.deb"

      - name: Upload packages
        run: ls -l build/deb
      - uses: actions/upload-artifact@v7
        with:
          # The .changes and .buildinfo are needed to lint the upload.
          name: scantpaper_${{ env.VERSION }}
          path: build/deb/scantpaper_${{ env.VERSION }}_*

      - name: Release packages
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            build/deb/scantpaper_${{ env.VERSION }}_all.deb

  debian-checks:
    needs: build
    runs-on: ubuntu-latest
    # A fresh container, so the test dependencies are resolved from the
    # package's own metadata rather than from the build job's build deps.
    container: debian:sid-slim
    steps:
      - name: Install container prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            lintian \
            autopkgtest \
            passwd \
            python3

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The job container runs as a different user from the workspace owner,
      # so git refuses to read the checkout unless it is marked safe.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Autopkgtest needs a test source, not just the binary: debian/tests is
      # not installed into the .deb. Render an unbuilt tree for it.
      - name: Render the source tree
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
        run: |
          version=$(python3 dev/prepare_deb.py --source-ref "$SOURCE_REF")
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Download the built package
        uses: actions/download-artifact@v7
        with:
          name: scantpaper_${{ env.VERSION }}
          path: artifacts

      - name: Run lintian
        run: lintian --fail-on warning artifacts/*.changes

      # -B stops autopkgtest from rebuilding the tree and using those binaries
      # in place of the downloaded .deb. The tests run as a normal user: some
      # of them simulate write failures with chmod, which root does not see.
      - name: Run autopkgtest
        run: |
          useradd -m tester
          chown -R tester "build/deb/scantpaper-${VERSION}"
          autopkgtest --user tester -B artifacts/*.deb \
            "./build/deb/scantpaper-${VERSION}" -- null
