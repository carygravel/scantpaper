name: Build packages
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git revision to package (default: github.sha)"
        required: false
        type: string

permissions:
  contents: write
  packages: write
jobs:
  check-launchpad:
    runs-on: ubuntu-latest
    outputs:
      launchpad_accessible: ${{ steps.check.outputs.accessible }}
    steps:
      - name: Check if launchpad.net is accessible
        id: check
        run: |
          # Try to access launchpad.net (timeout after 5 seconds)
          if curl -s --max-time 5 https://launchpad.net > /dev/null; then
            echo "accessible=true" >> $GITHUB_OUTPUT
          else
            echo "accessible=false" >> $GITHUB_OUTPUT
          fi
  build:
    runs-on: ubuntu-latest
    needs: check-launchpad
    if: needs.check-launchpad.outputs.launchpad_accessible == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: "REPO"
          # The renderer derives the version from the commit count, so it
          # needs the full history and the tags.
          fetch-depth: 0

      # Every packaging file comes from REPO/packaging/debian and is rendered
      # into a throwaway tree under REPO/build/deb. Nothing is authored in
      # this workflow, and no debian/ directory is created in the checkout.
      - name: Render the Debian source tree
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
        run: |
          cd REPO
          version=$(python3 dev/prepare_deb.py --source-ref "$SOURCE_REF")
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo add-apt-repository ppa:jeffreyratcliffe/ppa
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts fakeroot lintian equivs
          # Install build dependencies from the rendered control file.
          sudo mk-build-deps --install --remove \
            "REPO/build/deb/scantpaper-${VERSION}/debian/control"

      - name: Build DEB Package
        run: |
          cd "REPO/build/deb/scantpaper-${VERSION}"
          debuild -us -uc -b
          dpkg-deb --contents "../scantpaper_${VERSION}_all.deb"

      - name: Upload packages
        run: ls -l REPO/build/deb
      - uses: actions/upload-artifact@v7
        with:
          name: scantpaper_${{ env.VERSION }}_all.deb
          path: REPO/build/deb/scantpaper_${{ env.VERSION }}_all.deb

      - name: Release packages
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            REPO/build/deb/scantpaper_${{ env.VERSION }}_all.deb
