name: Test package

on: [push]

jobs:
  check-launchpad:
    runs-on: ubuntu-latest
    outputs:
      launchpad_accessible: ${{ steps.check.outputs.accessible }}
    steps:
      - name: Check if launchpad.net is accessible
        id: check
        run: |
          # Try to access launchpad.net (timeout after 5 seconds)
          if curl -s --max-time 5 https://launchpad.net > /dev/null; then
            echo "accessible=true" >> $GITHUB_OUTPUT
          else
            echo "accessible=false" >> $GITHUB_OUTPUT
          fi

  latest_w_ppa:
    runs-on: ubuntu-latest
    needs: check-launchpad
    if: needs.check-launchpad.outputs.launchpad_accessible == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo add-apt-repository ppa:jeffreyratcliffe/ppa
          sudo apt-get update
          # Runtime dependencies such as ocrmypdf, pikepdf, qpdf and polib
          # come from apt/PPA, matching what users of the PPA get. Only the
          # test runner is installed from pip rather than from Debian
          # packages, because the system python3-coverage (7.4.4 on noble)
          # predates the coverage.py releases that aligned statement and
          # branch accounting with newer Python: 7.5.2 stopped counting
          # module docstrings as executable statements, 7.6.2 stopped
          # reporting lambdas/comprehensions that do not complete as missing
          # branches, and 7.7.0 stopped counting constant if tests as
          # branches. Measured with the system packages, the coverage gate
          # below reports ~1% less than the identical test run measured
          # with a modern coverage.py. Switch back to the system packages
          # once the base image ships python3-coverage >= 7.7.0 (Resolute/
          # 26.04 ships 7.13.5).
          sudo apt-get install -y appstream djvulibre-bin fonts-dejavu-core \
            gir1.2-gtk-3.0 gobject-introspection imagemagick img2pdf \
            libtiff-tools ocrmypdf poppler-utils python3-gi python3-gi-cairo \
            python3-iso639 python3-polib python3-sane python3-tesserocr \
            python3-tomli qpdf tesseract-ocr-eng tesseract-ocr-deu unpaper \
            xauth xvfb
          python3 -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-mock pytest-timeout pytest-xvfb \
            ruff==0.16.7

          # add locale, needed for a couple of tests
          sudo locale-gen de_DE.UTF-8
      - name: Display Python version
        run: python3 -c "import sys; print(sys.version)"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Test
        run: pytest

  latest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream djvulibre-bin fonts-dejavu-core \
            gobject-introspection gir1.2-gtk-3.0 imagemagick libtiff-tools \
            poppler-utils python3-gi python3-gi-cairo python3-sane \
            python3-tesserocr qpdf tesseract-ocr-eng tesseract-ocr-deu unpaper
          python3 -m pip install --upgrade pip
          pip install --upgrade pip setuptools wheel packaging build
          pip install .[test]
          pip install ruff==0.16.7

          # add locale, needed for a couple of tests
          sudo locale-gen de_DE.UTF-8

      - name: Display Python version
        run: python3 -c "import sys; print(sys.version)"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Test
        run: pytest

  oldest:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
      - name: Define variables
        run: |
          (
            echo "GITHUB_REPO_NAME=$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f2)"
            echo "VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' pyproject.toml)"
          ) >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream djvulibre-bin fonts-dejavu-core \
            gir1.2-gtk-3.0 gobject-introspection imagemagick libtiff-tools \
            poppler-utils python3-gi python3-gi-cairo python3-sane \
            python3-tesserocr qpdf tesseract-ocr-eng tesseract-ocr-deu unpaper
          python -m pip install --upgrade pip
          pip install --upgrade pip setuptools wheel packaging build
          pip install .[test]
          pip install ruff==0.16.5

          # add locale, needed for a couple of tests
          sudo locale-gen de_DE.UTF-8

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Build wheel
        run: python3 -m build --wheel
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.GITHUB_REPO_NAME }}-${{ env.VERSION }}-py3-none-any.whl
          path: dist/${{ env.GITHUB_REPO_NAME }}-${{ env.VERSION }}-py3-none-any.whl

      - name: Release packages
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: dist/${{ env.GITHUB_REPO_NAME }}-${{ env.VERSION }}-py3-none-any.whl

      - name: Test
        run: pytest
