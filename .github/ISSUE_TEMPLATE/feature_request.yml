name: Feature request
description: Suggest a new feature or an improvement to scantpaper
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement!
  - type: textarea
    id: problem
    attributes:
      label: What is the problem you're trying to solve?
      description: A clear description of what you want to do that scantpaper can't currently do well.
      placeholder: |
        e.g. When I do X, I have to do Y manually because scantpaper can't Z.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What change would you like to see?
      description: Describe the feature or improvement you'd like, and roughly how it should behave.
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: What alternatives have you considered?
      description: Any workarounds or alternative approaches you've tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, or links that help explain the request.
