[project]
name = "scantpaper"
version = "3.0.16"
dependencies = [
  "img2pdf",
  "ocrmypdf>=15.4.3",
  "pikepdf",
  "pycairo",
  "PyGObject",
  "python-iso639",
  "python-sane",
  "tesserocr",
  "tomli>=1.1.0;python_version<'3.11'",
]
requires-python = ">=3.10"
authors = [
  {name = "Jeffrey Ratcliffe", email = "jffry@posteo.net"},
]
maintainers = [
  {name = "Jeffrey Ratcliffe", email = "jffry@posteo.net"},
]
description = "GUI to produce PDFs or DjVus from scanned documents"
readme = "README.md"
license = { text = "GPL-3.0-only" }
keywords = ['scan', 'pdf', 'djvu']
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: X11 Applications :: GTK",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python",
  "Topic :: Multimedia :: Graphics :: Capture :: Scanners"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# This could be removed if we moved to a src-based layout
[tool.setuptools.packages.find]
include = ["scantpaper*"]
exclude = ["scantpaper.tests"]

[tool.setuptools.package-data]
scantpaper = ["app.ui", "icons/**/*"]

[tool.pytest.ini_options]
addopts = "--timeout=300 --cov=scantpaper --cov-report=html --cov-fail-under=99"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore:GLib.unix_signal_add_full is deprecated:DeprecationWarning",
    "ignore:'asyncio.AbstractEventLoopPolicy' is deprecated:DeprecationWarning",
    "ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning",
]

[project.optional-dependencies]
test = [
    "black==26.3.1",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-timeout",
    "pytest-xvfb",
    "tomli",
]

[project.urls]
Homepage = "https://github.com/carygravel/scantpaper"
Repository = "https://github.com/carygravel/scantpaper.git"
"Bug Tracker" = "https://github.com/carygravel/scantpaper/issues"

[project.gui-scripts]
scantpaper = "scantpaper.app:main"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Ruff is an editor-time linter (used by zed). It is not a CI or packaging
# gate, so there is no build dependency on it. Enable every rule and suppress
# the categories that are noise on this legacy codebase. The `ignore` list is
# a blacklist to be ratcheted down as violations are fixed.
select = ["ALL"]
ignore = [
    "D",       # docstrings: too many existing violations to be actionable yet
    "ANN",     # type annotations: would require typing the whole codebase
    "SLF001",  # private member access: legitimately used across dialog/GTK code
    "FBT",     # boolean positional args: existing API surface is too large
    "PLR2004", # magic values: ubiquitous GUI widget constants
    "S",       # bandit: dominated by `assert` (S101) in tests
    "E501",    # line length: tracked by black's own width
    "COM812",  # trailing commas: black handles style
    "ARG001",  # unused function arguments
    "ARG002",  # unused method arguments
    "ARG005",  # unused lambda arguments
    "CPY001",  # copyright headers: not required by this project
    "INP001",  # implicit namespace package: project uses explicit packages
    "TD",      # TODO metadata requirements: not adopted as a convention
    "T201",    # print: legitimate in scripts
    "FIX002",  # TODO without issue ref: plain `# TODO:` notes are the project convention
    "PERF203", # try/except in loop: idiomatic for queue drains and iterator exhaustion
    "C901",    # complex functions: legacy code is deeply nested; refactoring is deferred
    "PLR0912", # too many branches: legacy functions are branch-heavy
    "PLR0913", # too many arguments: existing APIs take many params (scan/request dicts)
    "PLR0915", # too many statements: long legacy methods
    "PLR0917", # too many positional arguments: existing call sites pass many args
]

[tool.ruff.lint.per-file-ignores]
# Whitespace rules rewrite blank-line indentation inside the hOCR string
# literals this test compares byte-for-byte against saved output; fixing
# them corrupts the expected fixtures.
"scantpaper/tests/test_151_save_text.py" = ["W291", "W293"]
