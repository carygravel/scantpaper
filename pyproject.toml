[project]
name = "scantpaper"
version = "3.0.18"
dependencies = [
  "img2pdf",
  "ocrmypdf>=15.4.3",
  "pikepdf",
  "pycairo",
  "PyGObject",
  "python-iso639",
  "python-sane",
  "tesserocr",
  "tomli>=1.1.0;python_version<'3.11'",
]
requires-python = ">=3.10"
authors = [
  {name = "Jeffrey Ratcliffe", email = "jffry@posteo.net"},
]
maintainers = [
  {name = "Jeffrey Ratcliffe", email = "jffry@posteo.net"},
]
description = "GUI to produce PDFs or DjVus from scanned documents"
readme = "README.md"
license = { text = "GPL-3.0-only" }
keywords = ['scan', 'pdf', 'djvu']
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: X11 Applications :: GTK",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python",
  "Topic :: Multimedia :: Graphics :: Capture :: Scanners"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["scantpaper*"]
exclude = ["scantpaper.tests"]

[tool.setuptools.package-data]
scantpaper = ["app.ui", "icons/**/*"]

[tool.pytest.ini_options]
addopts = "--timeout=300 --cov=scantpaper --cov-report=html --cov-fail-under=99"
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore:GLib.unix_signal_add_full is deprecated:DeprecationWarning",
    "ignore:'asyncio.AbstractEventLoopPolicy' is deprecated:DeprecationWarning",
    "ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning",
    "ignore:.*found in sys.modules after import of package.*:RuntimeWarning",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[project.optional-dependencies]
test = [
    "polib",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-timeout",
    "pytest-xvfb",
    "tomli",
]

[project.urls]
Homepage = "https://github.com/carygravel/scantpaper"
Repository = "https://github.com/carygravel/scantpaper.git"
"Bug Tracker" = "https://github.com/carygravel/scantpaper/issues"

[project.gui-scripts]
scantpaper = "scantpaper.app:main"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.format]
# Ruff formats Python code blocks inside markdown files; exclude the OpenSpec
# docs tree so the formatter only governs actual Python source (the archived
# change records under openspec/changes/archive are historical and untouched).
exclude = ["openspec/**"]

[tool.ruff.lint]
# Ruff is an editor-time linter (used by zed). It is not a CI or packaging
# gate, so there is no build dependency on it. Enable every rule and suppress
# the categories that are noise on this legacy codebase. The `ignore` list is
# a blacklist to be ratcheted down as violations are fixed.
select = ["ALL"]
ignore = [
    "D203",    # incompatible with `no-blank-line-before-class` (D211)
    "D213",    # incompatible with `multi-line-summary-first-line` (D212)
    "ANN001",  # type annotations: would require typing the whole codebase
    "ANN002",  # (argument types and public/private return types). Only the
    "ANN003",  # mechanical ANN204/ANN205/ANN206 (special/static/class method
    "ANN201",  # return types) are enforced.
    "ANN202",
    "E501",    # line length: formatted by ruff
    "COM812",  # trailing commas: ruff documents this as a formatter conflict (unsupported combo)
    "CPY001",  # copyright headers: not required by this project
    "TD002",   # TODO author tags: not adopted as a convention
    "TD003",   # TODO issue links: not adopted as a convention
    "FIX002",  # TODO without issue ref: plain `# TODO:` notes are the project convention
]
# The well-formedness TD rules are enforced (canonical tag, colon, description);
# only the metadata conventions (author, issue link) are left unadopted.
task-tags = ["TODO", "FIXME"]

[tool.ruff.lint.per-file-ignores]
# The blank-line whitespace rule rewrites indentation inside the hOCR string
# literal this test compares byte-for-byte against saved output; fixing it
# corrupts the expected fixture.
"src/scantpaper/tests/test_151_save_text.py" = ["W293"]
# Tests assert on internal state, generate temporary files, and invoke PATH
# binaries (without a shell); these are intentional test-suite patterns. The
# literal values in test assertions (magic-value comparisons) are likewise
# deliberate expectations rather than magic numbers. Many test functions
# take numerous pytest fixtures as arguments (PLR0913/PLR0917), which is the
# idiomatic way to inject them. Tests also assert on private widget state
# (SLF001) to verify behaviour white-box.
"src/scantpaper/tests/**" = [
    "S101",
    "S105",
    "S108",
    "S603",
    "S607",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "SLF001",
]
# src/conftest.py is test infrastructure: it resolves binaries (e.g. fc-match)
# via PATH and dumps a debugging artifact to /tmp. It also prints diagnostic
# font/pixel information (T201) while creating the image fixtures. Its
# deprecated tempfile.mktemp uses (S306) are fixed in-code instead of
# suppressed.
"src/scantpaper/conftest.py" = ["S108", "S607", "T201"]
# dev/ is a scripts folder, not a Python package, so its scripts live in an
# implicit namespace directory; the package itself is under src/. The dev
# scripts also invoke translation tooling (intltool-extract, pygettext3) via
# PATH without ever using a shell, and print their progress/errors directly
# (T201) as one-shot developer CLI tools.
"dev/**" = ["INP001", "S603", "S607", "T201"]
